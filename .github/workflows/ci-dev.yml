name: CI Build & Test (Dev -> Main PR)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  test-build:
    name: TypeScript & Production Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript & Next.js Build Verification
        run: npm run build

      - name: Test Docker Build (Dry-Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
