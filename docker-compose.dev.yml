services:
  ydevhub-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ydevhub-dev
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - DB_DIR=/app/data
      - DB_PATH=/app/data/ydevhub_dev.db
    volumes:
      - ./data-dev:/app/data
