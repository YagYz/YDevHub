services:
  ydevhub:
    image: ghcr.io/yagyz/ydevhub:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ydevhub-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3080}:3000"
    environment:
      - NODE_ENV=production
      - DB_DIR=/app/data
      - DB_PATH=/app/data/ydevhub.db
      - APP_PORT=${APP_PORT:-3080}
      - HOST_DATA_DIR=${HOST_DATA_DIR:-/DATA/AppData/ydevhub}
      - LOCAL_DOMAIN=${LOCAL_DOMAIN:-ydevhub.yagyz.server}
      - SECONDARY_LOCAL_DOMAIN=${SECONDARY_LOCAL_DOMAIN:-ydevhub.local}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-8}
    volumes:
      # Verilerin depolanacağı sunucu yolu (.env içindeki HOST_DATA_DIR değişkeninden okunur)
      - ${HOST_DATA_DIR:-/DATA/AppData/ydevhub}:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: ydevhub-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-60}
