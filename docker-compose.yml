services:
  ydevhub:
    image: ghcr.io/yagyz/ydevhub:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ydevhub-app
    restart: unless-stopped
    ports:
      - "3080:3000"
    environment:
      - NODE_ENV=production
      - DB_DIR=/app/data
      - DB_PATH=/app/data/ydevhub.db
    volumes:
      # SQLite veritabanı ve yüklenen görseller (/app/data/uploads) bu klasörde kalıcı olarak saklanır
      - ./data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Watchtower: GitHub main dalına her merge yapıldığında oluşan yeni Docker imajını algılar ve konteyneri otomatik günceller
  watchtower:
    image: containrrr/watchtower
    container_name: ydevhub-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=60
